<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midari Smart— Home</title>
<meta name="google-site-verification" content="v6eWNLoGQP8LD-if-B7jUK3YQ5ukkkNR0gUpe6zd2C8">
<meta name="description" content="Midari Smart Home is a smart home rental platform that helps users find and explore homes for rent easily.">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #e0e7ff;
  --accent: #f59e0b;
  --success: #10b981;
  --danger: #ef4444;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --bg-body: #f8fafc;
  --white: #ffffff;
  --border: #e2e8f0;
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1),
               0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1),
               0 8px 10px -6px rgb(0 0 0 / 0.1);
  --radius: 12px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
#bg-video {
  position: fixed;
  top: 50%;
  left: 50%;
  min-width: 100%;
  min-height: 100%;
  width: auto;
  height: auto;
  z-index: -2;
  transform: translate(-50%, -50%);
  object-fit: cover;
}

.video-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(15, 23, 42, 0.6); /* Dark overlay for text readability */
  z-index: -1;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

html {
  width: 100%;
  min-height: 100%;
}

body {
  width: 100%;
  min-height: 100vh;
  color: var(--text-main);
  background: transparent;
  line-height: 1.6;
  overflow-x: hidden;
}


/* Tablets */
@media (max-width: 1024px) {
  body {
    background-attachment: scroll;
    background-position: center center;
  }
}

/* Mobile */
@media (max-width: 768px) {
  body {
    background-attachment: scroll;
    background-position: center center;
  }
}

/* Small mobile phones */
@media (max-width: 480px) {
  body {
    background-attachment: scroll;
    background-position: center center;
  }
}
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { font-size: 1.35rem; font-weight: 800; color: var(--white); text-decoration: none; display: flex; align-items: center; gap: 0.75rem; }
    .logo img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; }
    .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
    .logo-sub { font-size: 0.85rem; font-weight: 500; color: #cbd5e1; }
    nav ul { display: flex; list-style: none; gap: 2rem; align-items: center; flex-wrap: wrap; }
    nav a { text-decoration: none; color: #cbd5e1; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: var(--transition); }
    nav a:hover, nav a.active { color: var(--accent); }
    .nav-actions { display: flex; align-items: center; gap: 1rem; }
    
    .container { max-width: 1280px; margin: 2rem auto; padding: 0 1rem; }
    .hero-content { text-align: center; color: white; margin-bottom: 3rem; }
    .welcome-banner {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 1.25rem 1.5rem;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-lg);
      max-width: 100%;
    }
    .welcome-banner h2 { font-size: 1.35rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 0.5rem; flex-wrap: wrap; }
    .welcome-banner h2 i { color: var(--accent); }
    .welcome-banner p { font-size: 0.95rem; color: #cbd5e1; margin-top: 0.35rem; }
    .hero-content h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 1rem; color: white; letter-spacing: -1px; }
    .hero-content p.subtitle { font-size: 1.05rem; color: #cbd5e1; margin-bottom: 2rem; }
    
    .search-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 1rem;
      border-radius: 16px;
      display: grid;
      grid-template-columns: 1.2fr 1.2fr 1fr auto;
      gap: 0.75rem;
      max-width: 950px;
      margin: 0 auto;
      box-shadow: var(--shadow-lg);
    }
    .search-field { display: flex; flex-direction: column; text-align: left; padding: 0.5rem 1rem; background: var(--bg-body); border-radius: 10px; border: 1px solid transparent; }
    .search-field label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.2rem; }
    .search-field input, .search-field select { border: none; background: transparent; font-size: 0.95rem; font-weight: 600; color: var(--text-main); outline: none; width: 100%; }
    .search-btn { background-color: var(--primary); color: var(--white); border: none; border-radius: 10px; font-weight: 700; padding: 0.75rem 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: var(--transition); }
    .search-btn:hover { background-color: var(--primary-hover); }

    .property-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
    .property-card { background: var(--white); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-md); display: flex; flex-direction: column; transition: var(--transition); }
    .property-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
    .property-img-wrapper { position: relative; height: 220px; }
    .property-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .price-tag { position: absolute; bottom: 1rem; left: 1rem; background: rgba(15, 23, 42, 0.85); color: white; padding: 0.4rem 0.85rem; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
    .purpose-badge { position: absolute; top: 1rem; right: 1rem; background: var(--primary); color: white; padding: 0.3rem 0.75rem; border-radius: 6px; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; }
    .property-details-inner { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; }
    .btn-action-card { background: var(--primary-light); color: var(--primary); text-align: center; padding: 0.75rem; border-radius: 8px; text-decoration: none; font-weight: 700; margin-top: auto; display: block; }
    .btn-action-card:hover { background: var(--primary); color: white; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; }
    .modal-card { background: white; padding: 2rem; border-radius: var(--radius); width: 100%; max-width: 450px; box-shadow: var(--shadow-lg); text-align: left; position: relative; }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-muted); }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.3rem; }
    .form-group input { width: 100%; padding: 0.7rem; border: 1px solid var(--border); background: var(--bg-body); border-radius: 8px; font-size: 0.95rem; outline: none; }
    .btn-submit { width: 100%; background: var(--primary); color: var(--white); border: none; padding: 0.8rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .state-message { text-align: center; padding: 3rem 1rem; color: white; font-size: 1.05rem; grid-column: 1/-1; }

    /* Responsive Media Queries */
    @media (max-width: 900px) {
      .search-card {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
      .hero-content h1 { font-size: 1.8rem; }
      header { padding: 1rem; justify-content: center; }
      nav ul { justify-content: center; gap: 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- Background Video Element -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="./images/video.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>

  <header>
    <a href="index.html" class="logo">
      <img src="./images/logo.png.png" alt="Smart Home Rent Logo">
      <div class="logo-text">
        <span>Smart Home Rent</span>
        <span class="logo-sub">(Midari Group)</span>
      </div>
    </a>
    <nav>
      <ul id="nav-list">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="properties.html">Properties</a></li>
        <!-- Dynamic Company Nav Links injected via script below -->
      </ul>
    </nav>
    <div class="nav-actions">
    </div>
  </header>

  <div class="container">
    <div class="hero-content">
      <div class="welcome-banner">
        <h2><i class="fa-solid fa-hands-clapping"></i>Welcome</h2>
        <p>Verified homes for Lease, Rental, or Residential.</p>
      </div>
      <h1>Discover Your Next Home</h1>
      <p class="subtitle">Book your ideal home for rent or lease instantly in and complete your payments securely online.</p>
      
      <div class="search-card">
        <div class="search-field">
          <label><i class="fa-solid fa-location-dot"></i> Location</label>
          <input type="text" id="home-search-loc" placeholder="Serach Your Homes...">
        </div>
        <div class="search-field">
          <label><i class="fa-solid fa-building"></i> Category</label>
          <select id="home-search-type">
            <option value="">All Categories</option>
            <option value="1BHK">1BHK</option>
            <option value="2BHK">2BHK</option>
            <option value="3BHK">3BHK</option>
          </select>
        </div>
        <div class="search-field">
          <label><i class="fa-solid fa-handshake"></i> Purpose</label>
          <select id="home-search-purpose">
            <option value="">All Purpose</option>
            <option value="Rent">For Rent</option>
            <option value="Lease">For Lease</option>
          </select>
        </div>
        <button onclick="executeSearch()" class="search-btn">
          <i class="fa-solid fa-magnifying-glass"></i> Search
        </button>
      </div>
    </div>

    <h2 style="color: white; margin-bottom: 1.5rem; font-size: 1.6rem;"> Houses Available</h2>
    <div id="featured-grid" class="property-grid">
      <div class="state-message"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p>Loading Houses...</p></div>
    </div>
  </div>

  <!-- Company Login Modal Popup -->
  <div id="company-login-modal" class="modal-overlay">
    <div class="modal-card">
      <button onclick="closeCompanyLoginModal()" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
      <h2 style="margin-bottom: 1.2rem; color: var(--primary); font-size: 1.3rem;"><i class="fa-solid fa-shield-halved"></i> Company Login</h2>
      <form onsubmit="handleCompanyLogin(event)">
        <div class="form-group">
          <label>Username or Email</label>
          <input type="text" id="company-username" required placeholder="Username or Email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="company-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 0.5rem;">Login & Open Add Property</button>
        <div id="company-login-error" style="color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 0.75rem;"></div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000/api/properties' 
      : 'https://house-am79.onrender.com/api/properties';

    const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000/api' 
      : 'https://house-am79.onrender.com/api';

    // Render dynamic navigation based on company login status
    function updateNavbar() {
      const navList = document.getElementById('nav-list');
      const isLoggedIn = localStorage.getItem('company_token');

      let companyNavHtml = '';
      if (isLoggedIn) {
        companyNavHtml = `
          <li><a href="add-property.html" style="color: var(--success);"><i class="fa-solid fa-circle-plus"></i> Add Property</a></li>
          <li><a href="#" onclick="handleLogout(); return false;" style="color: #f87171;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        `;
      } else {
        companyNavHtml = `
          <li><a href="#" onclick="openCompanyLoginModal(); return false;" style="color: var(--accent);"><i class="fa-solid fa-lock"></i> Company Portal</a></li>
        `;
      }

      // Keep Home and Properties, append dynamic portal option
      navList.innerHTML = `
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="properties.html">Properties</a></li>
        ${companyNavHtml}
      `;
    }

    async function loadFeatured(searchQuery = '', propertyType = '', purpose = '') {
      try {
        let url = new URL(API_BASE);
        if (searchQuery) url.searchParams.append('search', searchQuery);
        if (propertyType) url.searchParams.append('propertyType', propertyType);
        if (purpose) url.searchParams.append('purpose', purpose);

        const res = await fetch(url.toString());
        const result = await res.json();
        const grid = document.getElementById('featured-grid');
        const isLoggedIn = localStorage.getItem('company_token');
        
        if(result.success && result.data.length > 0) {
          const properties = result.data.filter(p => p.name !== 'GLOBAL_PAYMENT_QR' && p.propertyType !== 'QR_CODE');

          if(properties.length === 0) {
            grid.innerHTML = '<div class="state-message"><p>No Houses Available</p></div>';
            return;
          }

          grid.innerHTML = properties.map(p => {
            const deleteBtnHtml = isLoggedIn 
              ? `<button onclick="deleteProperty('${p._id}')" style="background: var(--danger); color: white; border: none; padding: 0.6rem; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 0.5rem; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;"><i class="fa-solid fa-trash"></i> Delete House</button>` 
              : '';

            return `
              <div class="property-card" id="card-${p._id}">
                <div class="property-img-wrapper">
                  <img src="${(p.images && p.images.length > 0) ? p.images[0] : ''}" alt="${p.name}" onerror="this.style.display='none'">
                  <div class="purpose-badge">${p.purpose || 'Rent / Lease'}</div>
                  <div class="price-tag">₹${p.price} <span>/ mo</span></div>
                </div>
                <div class="property-details-inner">
                  <h3 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 0.3rem;">${p.name}</h3>
                  <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;"><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> ${p.location}, Karnataka</p>
                  <a href="property-details.html?id=${p._id}" class="btn-action-card">View Details & Book</a>
                  ${deleteBtnHtml}
                </div>
              </div>
            `;
          }).join('');
        } else {
          grid.innerHTML = '<div class="state-message"><p>No properties available right now.</p></div>';
        }
      } catch(e) {
        document.getElementById('featured-grid').innerHTML = '<div class="state-message" style="color:#f87171;"><p>Backend server connection error.</p></div>';
      }
    }

    async function deleteProperty(id) {
      if (!confirm('Are you sure you want to delete this house?')) return;

      const token = localStorage.getItem('company_token');
      try {
        const res = await fetch(`${API_BASE}/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const result = await res.json();
        if (result.success) {
          const card = document.getElementById(`card-${id}`);
          if (card) card.remove();
        } else {
          alert(result.error || 'Failed to delete property.');
        }
      } catch (err) {
        alert('Server connection error.');
      }
    }

    function executeSearch() {
      const loc = document.getElementById('home-search-loc').value.trim();
      const type = document.getElementById('home-search-type').value;
      const purpose = document.getElementById('home-search-purpose').value;
      loadFeatured(loc, type, purpose);
    }

    // Company Login Modal Controllers
    function openCompanyLoginModal() {
      document.getElementById('company-login-modal').style.display = 'flex';
    }

    function closeCompanyLoginModal() {
      document.getElementById('company-login-modal').style.display = 'none';
    }

    async function handleCompanyLogin(e) {
      e.preventDefault();
      const username = document.getElementById('company-username').value;
      const password = document.getElementById('company-password').value;

      try {
        const res = await fetch(`${BACKEND_URL}/company/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('company_token', data.token);
          window.location.href = 'add-property.html';
        } else {
          document.getElementById('company-login-error').innerText = data.error || 'Invalid credentials';
        }
      } catch (err) {
        document.getElementById('company-login-error').innerText = 'Server connection failed.';
      }
    }

    function handleLogout() {
      localStorage.removeItem('company_token');
      alert('Logged out successfully.');
      updateNavbar();
      loadFeatured();
    }

    updateNavbar();
    loadFeatured();
  </script>
</body>
</html>

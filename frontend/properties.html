<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties — HomeRent Karnataka</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --accent: #f59e0b;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      color: var(--text-main);
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c') center/cover fixed no-repeat;
      min-height: 100vh;
      line-height: 1.6;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 6%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .logo { font-size: 1.35rem; font-weight: 800; color: var(--white); text-decoration: none; display: flex; align-items: center; }
    .logo span { color: var(--accent); }
    .logo i { color: var(--accent); font-size: 1.5rem; margin-right: 0.5rem; }
    nav ul { display: flex; list-style: none; gap: 2.5rem; align-items: center; }
    nav a { text-decoration: none; color: #cbd5e1; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: var(--transition); }
    nav a:hover, nav a.active { color: var(--accent); }
    .container { max-width: 1280px; margin: 3rem auto; padding: 0 2rem; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
    }
    .filter-bar { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { flex: 1; min-width: 200px; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-body); font-size: 0.95rem; outline: none; }
    .filter-btn { background-color: var(--primary); color: white; border: none; padding: 0.75rem 1.75rem; border-radius: 8px; font-weight: 700; cursor: pointer; transition: var(--transition); }
    .filter-btn:hover { background-color: var(--primary-hover); }
    .property-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
    .property-card { background: var(--white); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-md); display: flex; flex-direction: column; transition: var(--transition); }
    .property-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
    .property-img-wrapper { position: relative; height: 220px; }
    .property-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .price-tag { position: absolute; bottom: 1rem; left: 1rem; background: rgba(15, 23, 42, 0.85); color: white; padding: 0.4rem 0.85rem; border-radius: 8px; font-weight: 700; }
    .purpose-badge { position: absolute; top: 1rem; right: 1rem; background: var(--primary); color: white; padding: 0.3rem 0.75rem; border-radius: 6px; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; }
    .property-details-inner { padding: 1.5rem; display: flex; flex-direction: column; flex: 1; }
    .btn-action-card { background: var(--primary-light); color: var(--primary); text-align: center; padding: 0.75rem; border-radius: 8px; text-decoration: none; font-weight: 700; margin-top: auto; display: block; }
    .btn-action-card:hover { background: var(--primary); color: white; }
    .state-message { text-align: center; padding: 4rem; color: var(--text-muted); font-size: 1.1rem; grid-column: 1/-1; }
  </style>
</head>
<body>

  <!-- Connected Navigation -->
  <header>
    <a href="index.html" class="logo">
      <i class="fa-solid fa-house-chimney-user"></i>Home<span>Rent</span>KA
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="properties.html" class="active">Properties</a></li>
        <li><a href="add-property.html">Add Property</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="glass-card">
      <h2 style="font-size: 2rem; font-weight: 800; margin-bottom: 1.5rem;">All Available Karnataka Properties (Live Data)</h2>
      
      <!-- Filter Controls -->
      <div class="filter-bar">
        <input type="text" id="filter-search" placeholder="Search by city or keyword...">
        <select id="filter-purpose">
          <option value="">All Purposes (Rent & Lease)</option>
          <option value="Rent">For Rent</option>
          <option value="Lease">For Lease</option>
        </select>
        <input type="number" id="filter-max-price" placeholder="Max Price (₹)">
        <button onclick="fetchProperties()" class="filter-btn"><i class="fa-solid fa-filter"></i> Apply Filters</button>
      </div>

      <!-- Real-Time Property Grid -->
      <div id="properties-grid" class="property-grid">
        <div class="state-message"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--primary); margin-bottom:1rem;"></i><p>Loading live properties from database...</p></div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:5000/api/properties';

    // Handle query params passed from Home search box
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('location')) {
      document.getElementById('filter-search').value = urlParams.get('location');
    }

    // REAL-TIME DATA FETCHING FOR PROPERTIES PAGE
    async function fetchProperties() {
      const search = document.getElementById('filter-search').value;
      const purpose = document.getElementById('filter-purpose').value;
      const maxPrice = document.getElementById('filter-max-price').value;

      let query = new URLSearchParams();
      if(search) query.append('search', search);
      if(purpose) query.append('purpose', purpose);
      if(maxPrice) query.append('maxPrice', maxPrice);

      try {
        const res = await fetch(`${API_BASE}?${query.toString()}`);
        const result = await res.json();
        const grid = document.getElementById('properties-grid');
        
        if(result.success) {
          if(result.data.length > 0) {
            grid.innerHTML = result.data.map(p => `
              <div class="property-card">
                <div class="property-img-wrapper">
                  <img src="${p.images[0] || 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9'}" alt="${p.name}">
                  <div class="purpose-badge">${p.purpose || 'Rent / Lease'}</div>
                  <div class="price-tag">₹${p.price} <span>/ mo</span></div>
                </div>
                <div class="property-details-inner">
                  <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.3rem;">${p.name}</h3>
                  <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;"><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> ${p.location}, Karnataka</p>
                  <div style="display:flex; gap:1rem; font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">
                    <span><i class="fa-solid fa-bed"></i> ${p.bedrooms} Beds</span>
                    <span><i class="fa-solid fa-bath"></i> ${p.bathrooms} Baths</span>
                    <span><i class="fa-solid fa-house"></i> ${p.propertyType}</span>
                  </div>
                  <a href="property-details.html?id=${p._id}" class="btn-action-card">View Details & Book</a>
                </div>
              </div>
            `).join('');
          } else {
            grid.innerHTML = '<div class="state-message"><p>No properties found matching your criteria.</p></div>';
          }
        }
      } catch(e) {
        document.getElementById('properties-grid').innerHTML = '<div class="state-message" style="color:#ef4444;"><p>Could not connect to backend server. Make sure server is running on port 5000.</p></div>';
      }
    }

    // Load live properties when page opens
    fetchProperties();
  </script>
</body>
</html>

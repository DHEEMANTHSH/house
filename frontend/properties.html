<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties — Midari Smart Home Rent</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #f59e0b;
      --success: #10b981;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      color: var(--text-main);
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1560518883-ce09059eeffa') center/cover fixed no-repeat;
      min-height: 100vh;
      line-height: 1.6;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { font-size: 1.35rem; font-weight: 800; color: var(--white); text-decoration: none; display: flex; align-items: center; }
    .logo span { color: var(--accent); }
    .logo i { color: var(--accent); font-size: 1.5rem; margin-right: 0.5rem; }
    nav ul { display: flex; list-style: none; gap: 2rem; align-items: center; flex-wrap: wrap; }
    nav a { text-decoration: none; color: #cbd5e1; font-weight: 600; font-size: 0.95rem; }
    nav a:hover, nav a.active { color: var(--accent); }

    .container { max-width: 1280px; margin: 2rem auto; padding: 0 1rem; }
    .page-title { color: var(--white); font-size: 2rem; font-weight: 800; margin-bottom: 1.5rem; text-align: center; }
    
    .properties-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }
    .property-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .property-card:hover { transform: translateY(-5px); }
    .property-img { width: 100%; height: 220px; object-fit: cover; }
    .property-content { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
    .property-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); }
    .property-location { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem; }
    .property-price { font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-bottom: 1.25rem; }
    .btn-details { margin-top: auto; background: var(--primary); color: white; text-align: center; padding: 0.75rem; border-radius: 8px; text-decoration: none; font-weight: 700; transition: 0.2s; display: block; }
    .btn-details:hover { background: var(--primary-hover); }
    
    .state-message { text-align: center; padding: 4rem 1rem; color: var(--white); font-size: 1.1rem; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i class="fa-solid fa-house-chimney-user"></i><span>Midari Smart Home Rent</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="properties.html" class="active">Properties</a></li>
        <li><a href="add-property.html">Add Houses</a></li>
        <li><a href="admin-qr-upload.html"><i class="fa-solid fa-qrcode"></i> Setup QR</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Available Houses for Rent</h1>
    
    <div id="properties-grid" class="properties-grid">
      <div class="state-message">
        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--accent); margin-bottom:1rem;"></i>
        <p>Loading available properties...</p>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000/api/properties' 
      : 'https://house-am79.onrender.com/api/properties';

    async function loadProperties() {
      const grid = document.getElementById('properties-grid');

      try {
        const res = await fetch(API_BASE);
        const result = await res.json();

        if (result.success && result.data && result.data.length > 0) {
          // FILTER OUT THE QR CODE RECORD SO IT NEVER SHOWS UP AS A HOUSE CARD
          const properties = result.data.filter(p => p.name !== 'GLOBAL_PAYMENT_QR' && p.propertyType !== 'QR_CODE');

          if (properties.length === 0) {
            grid.innerHTML = '<div class="state-message"><p>No properties available at the moment.</p></div>';
            return;
          }

          grid.innerHTML = properties.map(p => {
          const mainImg = (p.images && p.images.length > 0) ? p.images[0] : '';
            return `
              <div class="property-card">
                <img src="${mainImg}" alt="${p.name}" class="property-img">
                <div class="property-content">
                  <h3 class="property-title">${p.name}</h3>
                  <p class="property-location"><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> ${p.location}, Karnataka</p>
                  <div class="property-price">₹${p.price} <span style="font-size:0.8rem; color:var(--text-muted); font-weight:500;">/ month</span></div>
                  <a href="property-details.html?id=${p._id}" class="btn-details">View Details & Book</a>
                </div>
              </div>
            `;
          }).join('');
        } else {
          grid.innerHTML = '<div class="state-message"><p>No properties available at the moment.</p></div>';
        }
      } catch (err) {
        grid.innerHTML = '<div class="state-message"><p>Failed to load properties from server.</p></div>';
      }
    }

    loadProperties();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties — Midari Smart Home Rent</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      color: var(--text-main);
      background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.55)), url('./images/home-banner.jpeg') center / cover no-repeat fixed;
      min-height: 100vh;
      line-height: 1.6;
    }

    @media (max-width: 1024px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }
    }

    @media (max-width: 768px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }
    }

    @media (max-width: 480px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }
    }

    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { font-size: 1.35rem; font-weight: 800; color: var(--white); text-decoration: none; display: flex; align-items: center; }
    .logo span { color: var(--accent); }
    .logo i { color: var(--accent); font-size: 1.5rem; margin-right: 0.5rem; }
    nav ul { display: flex; list-style: none; gap: 2rem; align-items: center; flex-wrap: wrap; }
    nav a { text-decoration: none; color: #cbd5e1; font-weight: 600; font-size: 0.95rem; }
    nav a:hover, nav a.active { color: var(--accent); }

    .container { max-width: 1280px; margin: 2rem auto; padding: 0 1rem; }
    .page-title { color: var(--white); font-size: 2rem; font-weight: 800; margin-bottom: 1.5rem; text-align: center; }
    
    .filter-wrapper {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      padding: 1rem 1.25rem;
      border-radius: 16px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.3);
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .filter-box {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .filter-box:focus-within { border-color: var(--primary); background: var(--white); }
    .filter-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: #475569;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .filter-label i { color: var(--primary); font-size: 0.85rem; }
    .filter-input, .filter-select {
      border: none;
      outline: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      width: 100%;
      padding: 0.2rem 0;
    }
    .filter-input::placeholder { color: var(--text-muted); font-weight: 500; }
    .filter-search-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      height: 60px;
    }
    .filter-search-btn:hover { background: var(--primary-hover); }
    .filter-search-btn:active { transform: scale(0.98); }

    .properties-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }
    .property-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .property-card:hover { transform: translateY(-5px); }
    
    .property-img-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
    }
    .property-img { width: 100%; height: 100%; object-fit: cover; }
    
    .property-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--primary);
      color: white;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      text-transform: uppercase;
      z-index: 10;
    }

    .property-content { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
    .property-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main); }
    .property-location { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem; }
    .property-price { font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-bottom: 1.25rem; }
    
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: auto;
    }
    .btn-details { background: #e0e7ff; color: #4338ca; text-align: center; padding: 0.75rem; border-radius: 8px; text-decoration: none; font-weight: 700; transition: 0.2s; display: block; }
    .btn-details:hover { background: #c7d2fe; }
    
    .btn-delete { background: var(--danger); color: white; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; display: none; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; }
    .btn-delete:hover { background: var(--danger-hover); }
    
    .state-message { text-align: center; padding: 4rem 1rem; color: var(--white); font-size: 1.1rem; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i class="fa-solid fa-house-chimney-user"></i><span>Midari Smart Home Rent</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="properties.html" class="active">Properties</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Available Houses</h1>
    
    <div class="filter-wrapper">
      <div class="filter-box">
        <span class="filter-label"><i class="fa-solid fa-magnifying-glass"></i> SEARCH BY KEYWORD</span>
        <input type="text" id="location-box" class="filter-input" placeholder="Serach Your Homes...">
      </div>

      <div class="filter-box">
        <span class="filter-label"><i class="fa-solid fa-city"></i> CATEGORY</span>
        <select id="category-select" class="filter-select">
          <option value="">All Categories</option>
          <option value="1BHK">1BHK</option>
          <option value="2BHK">2BHK</option>
          <option value="3BHK">3BHK</option>
        </select>
      </div>

      <div class="filter-box">
        <span class="filter-label"><i class="fa-solid fa-handshake"></i> PURPOSE</span>
        <select id="purpose-select" class="filter-select">
          <option value="">All Purpose</option>
          <option value="Rent">Rent</option>
          <option value="Lease">Lease</option>
        </select>
      </div>

      <button id="search-btn" class="filter-search-btn">
        <i class="fa-solid fa-magnifying-glass"></i> Search
      </button>
    </div>

    <div id="properties-grid" class="properties-grid">
      <div class="state-message">
        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--accent); margin-bottom:1rem;"></i>
        <p>Loading available properties...</p>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000/api/properties' 
      : 'https://house-am79.onrender.com/api/properties';

    // Check if current user is admin/owner to display delete button
    const isAdmin = localStorage.getItem('is_admin') === 'true' || localStorage.getItem('company_token') !== null;

    async function loadProperties() {
      const grid = document.getElementById('properties-grid');
      
      const searchVal = document.getElementById('location-box').value.trim();
      const categoryVal = document.getElementById('category-select').value;
      const purposeVal = document.getElementById('purpose-select').value;

      let url = new URL(API_BASE);
      if (searchVal) url.searchParams.append('search', searchVal);
      if (categoryVal) url.searchParams.append('propertyType', categoryVal);
      if (purposeVal && purposeVal !== '') url.searchParams.append('purpose', purposeVal);

      grid.innerHTML = `
        <div class="state-message">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--accent); margin-bottom:1rem;"></i>
          <p>Searching properties...</p>
        </div>
      `;

      try {
        const res = await fetch(url.toString());
        const result = await res.json();

        if (result.success && result.data && result.data.length > 0) {
          const properties = result.data.filter(p => p.name !== 'GLOBAL_PAYMENT_QR' && p.propertyType !== 'QR_CODE');

          if (properties.length === 0) {
            grid.innerHTML = '<div class="state-message"><p>No Houses Available</p></div>';
            return;
          }

          grid.innerHTML = properties.map(p => {
            const mainImg = (p.images && p.images.length > 0) ? p.images[0] : '';
            const purposeLabel = p.purpose ? p.purpose.toUpperCase() : 'RENT';
            return `
              <div class="property-card" id="card-${p._id}">
                <div class="property-img-wrapper">
                  <span class="property-badge">${purposeLabel}</span>
                  <img src="${mainImg}" alt="${p.name}" class="property-img">
                </div>
                <div class="property-content">
                  <h3 class="property-title">${p.name}</h3>
                  <p class="property-location"><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> ${p.location}, Karnataka</p>
                  <div class="property-price">₹${p.price} <span style="font-size:0.8rem; color:var(--text-muted); font-weight:500;">/ month</span></div>
                  <div class="card-actions">
                    <a href="property-details.html?id=${p._id}" class="btn-details">View Details & Book</a>
                    <button class="btn-delete" style="${isAdmin ? 'display:flex;' : 'display:none;'}" onclick="deleteProperty('${p._id}')">
                      <i class="fa-solid fa-trash-can"></i> Delete House
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        } else {
          grid.innerHTML = '<div class="state-message"><p>No properties match your filter criteria.</p></div>';
        }
      } catch (err) {
        grid.innerHTML = '<div class="state-message"><p>Failed to load properties from server.</p></div>';
      }
    }

    async function deleteProperty(id) {
      if (!confirm('Are you sure you want to delete this property?')) return;
      try {
        const token = localStorage.getItem('company_token') || '';
        const res = await fetch(`${API_BASE}/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const result = await res.json();
        if (res.ok && result.success) {
          const card = document.getElementById(`card-${id}`);
          if (card) card.remove();
        } else {
          alert(result.error || 'Failed to delete property.');
        }
      } catch (err) {
        alert('Error connecting to server for deletion.');
      }
    }

    document.getElementById('search-btn').addEventListener('click', loadProperties);
    document.getElementById('location-box').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadProperties();
    });

    loadProperties();
  </script>
</body>
</html>

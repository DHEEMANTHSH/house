<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup QR — Midari Smart Home Rent</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #f59e0b;
      --success: #10b981;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      color: var(--text-main);
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('./images/home-banner.jpg') center / cover no-repeat;
      min-height: 100vh;
      line-height: 1.6;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { font-size: 1.35rem; font-weight: 800; color: var(--white); text-decoration: none; display: flex; align-items: center; }
    .logo span { color: var(--accent); }
    .logo i { color: var(--accent); font-size: 1.5rem; margin-right: 0.5rem; }
    nav ul { display: flex; list-style: none; gap: 2rem; align-items: center; flex-wrap: wrap; }
    nav a { text-decoration: none; color: #cbd5e1; font-weight: 600; font-size: 0.95rem; }
    nav a:hover, nav a.active { color: var(--accent); }

    .container { max-width: 600px; margin: 3rem auto; padding: 0 1rem; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .form-group { margin-bottom: 1.5rem; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; }
    .form-group input[type="file"] { width: 100%; padding: 0.75rem; border: 2px dashed var(--border); background: var(--bg-body); border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
    
    .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { background: var(--primary-hover); }

    .qr-preview-box { margin-top: 1.5rem; padding: 1rem; background: var(--bg-body); border-radius: 8px; border: 1px solid var(--border); }
    .qr-preview-box img { max-width: 180px; max-height: 180px; object-fit: contain; border-radius: 6px; margin-top: 0.5rem; display: none; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i class="fa-solid fa-house-chimney-user"></i><span>Midari Smart Home Rent</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="properties.html">Properties</a></li>
        <li><a href="add-property.html">Add Houses</a></li>
        <li><a href="admin-qr-upload.html" class="active"><i class="fa-solid fa-qrcode"></i> Setup QR</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="glass-card">
      <div style="font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem;"><i class="fa-solid fa-qrcode"></i></div>
      <h2 style="margin-bottom: 0.5rem; font-size: 1.5rem; font-weight: 800;">Company Payment QR Setup</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Upload your official payment QR code image to sync globally across all customer devices.</p>

      <form id="qrForm" onsubmit="uploadQRCode(event)">
        <div class="form-group">
          <label>Select QR Image File</label>
          <input type="file" id="qrFileInput" accept="image/*" required onchange="previewFile(event)">
        </div>
        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-cloud-arrow-up"></i> Save & Update QR Code
        </button>
      </form>

      <div class="qr-preview-box">
        <label style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Current Active QR Preview</label>
        <img id="currentQrPreview" src="" alt="Active QR Code" />
        <p id="noQrMsg" style="font-size: 0.85rem; color: var(--text-muted);">Loading active QR code...</p>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000/api/properties' 
      : 'https://house-am79.onrender.com/api/properties';

    // Cloudinary Credentials
    const CLOUDINARY_CLOUD_NAME = 'ychibp8r';
    const CLOUDINARY_PRESET = 'ml_default';

    function previewFile(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('currentQrPreview').src = e.target.result;
          document.getElementById('currentQrPreview').style.display = 'block';
          document.getElementById('noQrMsg').style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    }

    async function loadExistingQR() {
      const imgElem = document.getElementById('currentQrPreview');
      const noMsg = document.getElementById('noQrMsg');

      try {
        const res = await fetch(API_BASE);
        const result = await res.json();

        if (result.success && result.data && result.data.length > 0) {
          const qrItem = result.data.reverse().find(p => p.propertyType === 'QR_CODE' || p.name === 'GLOBAL_PAYMENT_QR');
          
          if (qrItem && qrItem.images && qrItem.images.length > 0) {
            imgElem.src = qrItem.images[0];
            imgElem.style.display = 'block';
            noMsg.style.display = 'none';
          } else {
            imgElem.style.display = 'none';
            noMsg.style.display = 'block';
            noMsg.innerText = 'No QR code uploaded yet.';
          }
        }
      } catch (err) {
        noMsg.innerText = 'Error loading preview.';
      }
    }

    async function uploadQRCode(e) {
      e.preventDefault();
      const fileInput = document.getElementById('qrFileInput');
      const file = fileInput.files[0];
      if (!file) return;

      const submitBtn = e.target.querySelector('button');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Uploading QR Code...';

      try {
        const cloudData = new FormData();
        cloudData.append('file', file);
        cloudData.append('upload_preset', CLOUDINARY_PRESET);

        const cloudRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: 'POST',
          body: cloudData
        });
        const cloudResult = await cloudRes.json();

        if (!cloudRes.ok) {
          throw new Error(cloudResult.error?.message || 'Cloudinary upload failed');
        }

        const imageUrl = cloudResult.secure_url;
        submitBtn.innerText = 'Saving to Database...';

        const propertyPayload = {
          name: 'GLOBAL_PAYMENT_QR',
          description: 'Global payment QR code',
          price: 1,
          location: 'Global',
          propertyType: 'QR_CODE',
          purpose: 'Rent',
          bedrooms: 1,
          bathrooms: 1,
          isFeatured: false,
          ownerName: 'Admin',
          ownerPhone: '+919999999999',
          ownerEmail: 'admin@mitari.com',
          images: [imageUrl]
        };

        const token = localStorage.getItem('company_token') || 'company-auth-token-xyz';
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify(propertyPayload)
        });

        const result = await res.json();
        if (res.ok && result.success) {
          alert('QR Code updated successfully!');
          fileInput.value = '';
          loadExistingQR();
        } else {
          alert('Failed to update QR code: ' + (result.error || 'Unknown error'));
        }
      } catch (err) {
        alert('Upload error: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Save & Update QR Code Globally';
      }
    }

    loadExistingQR();
  </script>
</body>
</html>

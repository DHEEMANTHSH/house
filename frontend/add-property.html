<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Property — HomeRent Karnataka</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #f59e0b;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      color: var(--text-main);
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c') center/cover fixed no-repeat;
      min-height: 100vh;
      line-height: 1.6;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { font-size: 1.35rem; font-weight: 800; color: var(--white); text-decoration: none; display: flex; align-items: center; }
    .logo span { color: var(--accent); }
    .logo i { color: var(--accent); font-size: 1.5rem; margin-right: 0.5rem; }
    nav ul { display: flex; list-style: none; gap: 2rem; align-items: center; flex-wrap: wrap; }
    nav a { text-decoration: none; color: #cbd5e1; font-weight: 600; font-size: 0.95rem; }
    nav a:hover, nav a.active { color: var(--accent); }
    
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-lg);
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-body); font-size: 0.95rem; outline: none; }
    
    .form-row { display: flex; gap: 1rem; flex-direction: column; }
    
    .file-upload-box {
      border: 2px dashed var(--border);
      padding: 1.5rem;
      text-align: center;
      border-radius: 8px;
      background: var(--bg-body);
      cursor: pointer;
      transition: border-color 0.2s;
      display: block;
    }
    .file-upload-box:hover { border-color: var(--primary); }
    
    #preview-container { margin-top: 1rem; display: none; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    #preview-container img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }

    .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background: var(--primary-hover); }

    @media (min-width: 768px) {
      .glass-card { padding: 2.5rem; }
      .form-row { flex-direction: row; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i class="fa-solid fa-house-chimney-user"></i>Home<span>Rent</span>KA
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="properties.html">Properties</a></li>
        <li><a href="add-property.html" class="active">Add Houses</a></li>
        <li><a href="admin-qr-upload.html"><i class="fa-solid fa-qrcode"></i> Setup QR</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="glass-card">
      <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 1.5rem;"><i class="fa-solid fa-circle-plus" style="color:var(--primary);"></i> Adding Home</h2>
      
      <form id="add-property-form" onsubmit="submitProperty(event)">
        <div class="form-group">
          <label>Property Name</label>
          <input type="text" id="name" placeholder="e.g. Elegant 2BHK Apartment in Indiranagar" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="description" placeholder="Describe layout, ventilation, nearby landmarks..." style="height: 100px;" required></textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label>Price (₹ / month)</label>
            <input type="number" id="price" placeholder="e.g. 25000" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label>City / Location</label>
            <input type="text" id="location" placeholder="e.g. Bengaluru" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label>Property Type</label>
            <select id="propertyType">
              <option value="1BHK">1BHK</option>
              <option value="2BHK">2BHK</option>
              <option value="3BHK">3BHK</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;">
            <label>Purpose</label>
            <select id="purpose">
              <option value="Rent">For Rent</option>
              <option value="Lease">For Lease</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label>Bedrooms</label>
            <input type="number" id="bedrooms" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label>Bathrooms</label>
            <input type="number" id="bathrooms" required>
          </div>
        </div>

        <div class="form-group">
          <label>Browse Photos from Device</label>
          <input type="file" id="imageFiles" name="images" accept="image/*" multiple onchange="previewImages(event)" required style="display: none;">
          <label class="file-upload-box" for="imageFiles">
            <i class="fa-solid fa-cloud-arrow-up fa-2x" style="color: var(--primary); margin-bottom: 0.5rem;"></i>
            <p id="file-name-label" style="font-weight: 600; color: var(--text-main); font-size: 0.9rem;">Click here to select 1 to 6 house photos</p>
          </label>
          <div id="preview-container"></div>
        </div>
        
        <h3 style="font-size: 1.1rem; margin: 1.5rem 0 1rem;">Owner Contact Details</h3>
        <div class="form-row">
          <div class="form-group" style="flex:1;"><label>Owner Name</label><input type="text" id="ownerName" placeholder="Rajesh Kumar" required></div>
          <div class="form-group" style="flex:1;"><label>Phone Number</label><input type="text" id="ownerPhone" placeholder="+91 98765 43210" required></div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="ownerEmail" placeholder="rajesh@gmail.com" required>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" id="isFeatured" style="width: auto;"> <label for="isFeatured" style="margin-bottom: 0; display: inline;">Feature this property on the Home Page</label>
        </div>

        <button type="submit" class="btn-submit">Add House</button>
      </form>
    </div>
  </main>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000/api/properties' 
      : 'https://house-am79.onrender.com/api/properties';

    async function compressImage(file, maxWidth = 1200, quality = 0.75) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              resolve(new File([blob], file.name, {
                type: 'image/jpeg',
                lastModified: Date.now()
              }));
            }, 'image/jpeg', quality);
          };
        };
      });
    }

    function previewImages(event) {
      const files = event.target.files;
      const previewContainer = document.getElementById('preview-container');
      previewContainer.innerHTML = '';

      if (files.length > 6) {
        alert('You can only upload a maximum of 6 images.');
        event.target.value = '';
        document.getElementById('file-name-label').innerText = 'Click here to select 1 to 6 house photos';
        previewContainer.style.display = 'none';
        return;
      }

      if (files.length > 0) {
        document.getElementById('file-name-label').innerText = `${files.length} photo(s) selected`;
        previewContainer.style.setProperty('display', 'grid', 'important');

        Array.from(files).forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            const img = document.createElement('img');
            img.src = e.target.result;
            previewContainer.appendChild(img);
          }
          reader.readAsDataURL(file);
        });
      } else {
        previewContainer.style.display = 'none';
      }
    }

    async function submitProperty(e) {
      e.preventDefault();

      const token = localStorage.getItem('company_token') || 'company-auth-token-xyz';
      const submitBtn = document.querySelector('.btn-submit');
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'Compressing & Uploading Photos...';

      try {
        const formData = new FormData();
        formData.append('name', document.getElementById('name').value);
        formData.append('description', document.getElementById('description').value);
        formData.append('price', document.getElementById('price').value);
        formData.append('location', document.getElementById('location').value);
        formData.append('propertyType', document.getElementById('propertyType').value);
        formData.append('purpose', document.getElementById('purpose').value);
        formData.append('bedrooms', document.getElementById('bedrooms').value);
        formData.append('bathrooms', document.getElementById('bathrooms').value);
        formData.append('isFeatured', document.getElementById('isFeatured').checked);
        formData.append('ownerName', document.getElementById('ownerName').value);
        formData.append('ownerPhone', document.getElementById('ownerPhone').value);
        formData.append('ownerEmail', document.getElementById('ownerEmail').value);

        const imageFiles = document.getElementById('imageFiles').files;
        
        for (let i = 0; i < imageFiles.length; i++) {
          const compressedFile = await compressImage(imageFiles[i]);
          formData.append('images', compressedFile);
        }

        submitBtn.innerText = 'Uploading to Cloudinary & Saving...';

        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });
        
        let result;
        const textResponse = await res.text();
        try {
          result = JSON.parse(textResponse);
        } catch (parseErr) {
          throw new Error("Server returned non-JSON response: " + textResponse.substring(0, 100));
        }
        
        if (res.ok) {
          alert('Property and photos uploaded successfully via Cloudinary!');
          window.location.href = 'properties.html';
        } else {
          const errorMessage = typeof result.error === 'string' 
            ? result.error 
            : (result.message || JSON.stringify(result.error || 'Unknown server error'));
          alert('Failed to add property: ' + errorMessage);
          submitBtn.disabled = false;
          submitBtn.innerText = 'Add House';
        }
      } catch (err) {
        console.error('Fetch error:', err);
        alert('Could not connect to backend server or upload timed out. Ensure your server is running and images are not too large.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Add House';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google47c25c53efc89382.html" content="Midari Smart Home Rent">
  <title>Property Details — Midari Smart Home Rent</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --accent: #f59e0b;
      --success: #10b981;
      --whatsapp: #25D366;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      color: var(--text-main);
      background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.55)), url('./images/home-banner.jpeg') center / cover no-repeat fixed;
      min-height: 100vh;
      line-height: 1.6;
    }

    @media (max-width: 1024px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }
    }

    @media (max-width: 768px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }
    }

    @media (max-width: 480px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }
    }

    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 5%;
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { font-size: 1.35rem; font-weight: 800; color: var(--white); text-decoration: none; display: flex; align-items: center; }
    .logo span { color: var(--accent); }
    .logo i { color: var(--accent); font-size: 1.5rem; margin-right: 0.5rem; }
    nav ul { display: flex; list-style: none; gap: 2rem; align-items: center; flex-wrap: wrap; }
    nav a { text-decoration: none; color: #cbd5e1; font-weight: 600; font-size: 0.95rem; }
    nav a:hover { color: var(--accent); }
    
    .container { max-width: 1280px; margin: 2rem auto; padding: 0 1rem; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 1.5rem;
      box-shadow: var(--shadow-lg);
    }
    .details-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: start;
    }
    
    /* Action Buttons */
    .btn-action-card { background: var(--success); color: white; text-align: center; padding: 0.9rem; border-radius: 8px; text-decoration: none; font-weight: 700; cursor: pointer; border: none; width: 100%; font-size: 0.95rem; display: block; transition: var(--transition); }
    .btn-action-card:hover { opacity: 0.9; }
    
    .btn-secondary-action { background: var(--whatsapp); color: white; text-align: center; padding: 0.9rem; border-radius: 8px; text-decoration: none; font-weight: 700; cursor: pointer; border: none; width: 100%; font-size: 0.95rem; display: block; margin-top: 0.75rem; transition: var(--transition); }
    .btn-secondary-action:hover { opacity: 0.9; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; }
    .modal-card { background: white; padding: 2rem; border-radius: var(--radius); width: 100%; max-width: 450px; box-shadow: var(--shadow-lg); text-align: left; position: relative; max-height: 90vh; overflow-y: auto; }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-muted); }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem; }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); background: var(--bg-body); border-radius: 8px; font-size: 0.95rem; outline: none; }
    .btn-submit { width: 100%; background: var(--success); color: var(--white); border: none; padding: 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .state-message { text-align: center; padding: 3rem 1rem; color: var(--text-main); font-size: 1.05rem; }

    @media (min-width: 900px) {
      .details-grid { grid-template-columns: 1.5fr 1fr; gap: 2.5rem; }
      .glass-card { padding: 2.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i class="fa-solid fa-house-chimney-user"></i><span>Midari Smart Home Rent</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="properties.html">Properties</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div id="property-details-container" class="glass-card">
      <div class="state-message"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i><p>Loading property details...</p></div>
    </div>
  </main>

  <!-- Payment Modal -->
  <div id="payment-modal" class="modal-overlay">
    <div class="modal-card">
      <button onclick="closePaymentModal()" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
      <h2 style="margin-bottom: 0.5rem; color: var(--primary); font-size: 1.4rem;"><i class="fa-solid fa-shield-halved"></i> Secure Checkout</h2>
      <p id="modal-property-title" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;"></p>
      
      <!-- Company QR Code Display Box -->
      <div style="text-align: center; background: var(--bg-body); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Scan QR to Pay via UPI</label>
        <img id="modal-company-qr" src="" alt="Company Payment QR" style="max-width: 150px; max-height: 150px; object-fit: contain; border-radius: 6px; display: none; margin: 0 auto;" />
        <p id="no-qr-warning" style="font-size: 0.85rem; color: var(--text-muted); display: none;">No company payment QR code uploaded yet.</p>
      </div>

      <form onsubmit="processPayment(event)">
        <div class="form-group">
          <label>Your Full Name</label>
          <input type="text" id="pay-buyer-name" placeholder="Name" required>
        </div>
        <div class="form-group">
          <label>Your Phone Number</label>
          <input type="text" id="pay-buyer-phone" placeholder="Number" required>
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select id="pay-method" onchange="togglePaymentFields()">
            <option value="qr Code">UPI (GPay / PhonePe / Paytm / QR)</option>
          </select>
        </div>
        <div id="upi-field" class="form-group">
          <label>UPI Transaction ID / UTR (12 Digits)</label>
          <input type="text" id="pay-utr" placeholder="e.g. 432109876543" required>
        </div>
        <div id="card-fields" style="display: none;">
          <div class="form-group"><label>Card Number</label><input type="text" placeholder="4111 2222 3333 4444"></div>
          <div style="display: flex; gap: 1rem;">
          </div>
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 1rem;">
          <i class="fa-solid fa-lock"></i> Pay Securely & Book Now
        </button>
      </form>
    </div>
  </div>

  <!-- WhatsApp Inquiry Modal -->
  <div id="contact-modal" class="modal-overlay">
    <div class="modal-card">
      <button onclick="closeContactModal()" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
      <h2 style="margin-bottom: 0.5rem; color: var(--whatsapp); font-size: 1.4rem;"><i class="fa-brands fa-whatsapp"></i> Connect via WhatsApp</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.25rem;">Fill in your details below. Clicking send will instantly open WhatsApp to message the owner directly.</p>
      
      <form onsubmit="sendWhatsAppInquiry(event)">
        <div class="form-group">
          <label>Your Full Name</label>
          <input type="text" id="buyer-name" placeholder="Pooja Shetty" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="buyer-phone" placeholder="+91 98765 43210" required>
        </div>
        <div class="form-group">
          <label>Message / Intended Move Date</label>
          <input type="text" id="buyer-message" placeholder="Looking to move in by next month..." required>
        </div>
        <button type="submit" class="btn-submit" style="background: var(--whatsapp); margin-top: 1rem;">
          <i class="fa-brands fa-whatsapp"></i> Send Details to Owner on WhatsApp
        </button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000/api/properties' 
      : 'https://house-am79.onrender.com/api/properties';
      
    let currentProperty = null;

    async function loadDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const container = document.getElementById('property-details-container');

      if (!id) {
        container.innerHTML = '<div class="state-message"><p>Invalid Property ID specified. Please go back and select a property.</p></div>';
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/${id}`);
        const result = await res.json();
        if (result.success) {
          const p = result.data;
          currentProperty = p;

          const imagesList = (p.images && p.images.length > 0) ? p.images : ['https://images.unsplash.com/photo-1600596542815-ffad4c1539a9'];
          const mainImage = imagesList[0];

          let thumbnailsHtml = '';
          if (imagesList.length > 1) {
            thumbnailsHtml = `
              <div style="display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px;">
                ${imagesList.map((img, idx) => `
                  <img src="${img}" onclick="document.getElementById('main-property-img').src='${img}'" style="width: 80px; height: 60px; object-fit: cover; border-radius: 6px; border: 2px solid ${idx === 0 ? 'var(--primary)' : 'var(--border)'}; cursor: pointer; transition: 0.2s;" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
                `).join('')}
              </div>
            `;
          }

          container.innerHTML = `
            <div class="details-grid">
              <div>
                <div>
                  <img id="main-property-img" src="${mainImage}" style="width:100%; max-height:350px; object-fit:cover; border-radius:var(--radius);">
                  ${thumbnailsHtml}
                </div>
                <h1 style="font-size: 1.6rem; margin-top: 1.25rem; margin-bottom: 0.4rem; line-height: 1.3;">${p.name}</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem;"><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> ${p.location}, Karnataka</p>
                <div style="font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 1.25rem;">₹${p.price} <span style="font-size:0.85rem; color:var(--text-muted);">/ month (${p.purpose || 'Rent/Lease'})</span></div>
                <h3 style="margin-bottom: 0.4rem; font-size: 1.1rem;">Description</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.25rem; font-size: 0.95rem;">${p.description}</p>
                <h3 style="margin-bottom: 0.4rem; font-size: 1.1rem;">Key Specs</h3>
                <p style="margin-bottom: 1.25rem; font-size: 0.95rem;"><strong>${p.bedrooms}</strong> Bedrooms &nbsp;|&nbsp; <strong>${p.bathrooms}</strong> Bathrooms &nbsp;|&nbsp; <strong>${p.propertyType}</strong></p>
              </div>
              <div style="background: var(--bg-body); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border);">
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Owner Contact</h3>
                <p style="margin-bottom: 0.5rem; font-size: 0.95rem;"><strong>${p.owner.name}</strong></p>
                <p style="margin-bottom: 0.5rem; font-size: 0.95rem;"><i class="fa-solid fa-phone"></i> ${p.owner.phone}</p>
                <p style="margin-bottom: 1.25rem; font-size: 0.95rem;"><i class="fa-solid fa-envelope"></i> ${p.owner.email}</p>
                
                <!-- Option 1: Pay Online Now -->
                <button onclick="openPaymentModal()" class="btn-action-card">
                  <i class="fa-solid fa-credit-card"></i> Book & Pay Online Now
                </button>

                <!-- Option 2: Reserve via WhatsApp -->
                <button onclick="openContactModal()" class="btn-secondary-action">
                  <i class="fa-brands fa-whatsapp"></i> Reserve & Contact Owner via WhatsApp
                </button>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = '<div class="state-message"><p>Property not found.</p></div>';
        }
      } catch (e) {
        container.innerHTML = '<div class="state-message"><p>Failed to connect to backend server.</p></div>';
      }
    }

    // Fetch and display global QR code in checkout modal
    async function openPaymentModal() {
      document.getElementById('modal-property-title').innerText = `Booking: ${currentProperty.name} (₹${currentProperty.price}/mo)`;
      
      const qrImage = document.getElementById('modal-company-qr');
      const noQrWarning = document.getElementById('no-qr-warning');

      try {
        const res = await fetch(API_BASE);
        const result = await res.json();

        if (result.success && result.data && result.data.length > 0) {
          const qrItem = result.data.reverse().find(p => p.propertyType === 'QR_CODE' || p.name === 'GLOBAL_PAYMENT_QR');
          
          if (qrItem && qrItem.images && qrItem.images.length > 0) {
            qrImage.src = qrItem.images[0];
            qrImage.style.display = 'block';
            noQrWarning.style.display = 'none';
          } else {
            qrImage.style.display = 'none';
            noQrWarning.style.display = 'block';
          }
        } else {
          qrImage.style.display = 'none';
          noQrWarning.style.display = 'block';
        }
      } catch (err) {
        qrImage.style.display = 'none';
        noQrWarning.style.display = 'block';
      }

      document.getElementById('payment-modal').style.display = 'flex';
    }

    function closePaymentModal() {
      document.getElementById('payment-modal').style.display = 'none';
    }

    function togglePaymentFields() {
      const method = document.getElementById('pay-method').value;
      document.getElementById('upi-field').style.display = method === 'upi' ? 'block' : 'none';
      document.getElementById('card-fields').style.display = method === 'card' ? 'block' : 'none';
    }
    
    // Process Payment & Send WhatsApp Message
    function processPayment(e) {
      e.preventDefault();
      
      const buyerName = document.getElementById('pay-buyer-name').value.trim();
      const buyerPhone = document.getElementById('pay-buyer-phone').value.trim();
      const utrNumber = document.getElementById('pay-utr').value.trim();
      const payMethod = document.getElementById('pay-method').value;

      let ownerPhone = currentProperty.owner.phone.replace(/[^0-9]/g, '');
      if (ownerPhone.length === 10) {
        ownerPhone = '91' + ownerPhone;
      }

      const confirmationText = 
        `🚨 *NEW ONLINE BOOKING & PAYMENT* 🚨\n\n` +
        `Hello ${currentProperty.owner.name},\n` +
        `My name is ${buyerName} and I have successfully booked your property through Midari Smart Home Rent!\n\n` +
        `🏠 *Property:* ${currentProperty.name}\n` +
        `📍 *Location:* ${currentProperty.location}\n` +
        `💰 *Amount Paid:* ₹${currentProperty.price}/mo\n\n` +
        `👤 *Customer Name:* ${buyerName}\n` +
        `📞 *Customer Phone:* ${buyerPhone}\n` +
        `💳 *Payment Mode:* ${payMethod.toUpperCase()}\n` +
        `🔖 *UTR / Transaction ID:* ${utrNumber}\n\n` +
        `✅ Status: Booked Successfully! Please verify and confirm.`;

      const whatsappURL = `https://wa.me/${ownerPhone}?text=${encodeURIComponent(confirmationText)}`;

      alert('Payment Successful! Your house booking has been confirmed and details have been sent to the owner via WhatsApp.');
      closePaymentModal();
      
      window.open(whatsappURL, '_blank');
      window.location.href = 'index.html';
    }

    // WhatsApp Inquiry Modal Controls
    function openContactModal() {
      document.getElementById('contact-modal').style.display = 'flex';
    }
    function closeContactModal() {
      document.getElementById('contact-modal').style.display = 'none';
    }
    function sendWhatsAppInquiry(e) {
      e.preventDefault();
      
      const buyerName = document.getElementById('buyer-name').value.trim();
      const buyerPhone = document.getElementById('buyer-phone').value.trim();
      const buyerMessage = document.getElementById('buyer-message').value.trim();

      let ownerPhone = currentProperty.owner.phone.replace(/[^0-9]/g, '');
      if (ownerPhone.length === 10) {
        ownerPhone = '91' + ownerPhone;
      }

      const messageText = 
        `Hello ${currentProperty.owner.name},\n\n` +
        `I am interested in your property listed on Midari Smart Home Rent!\n\n` +
        `🏠 *Property:* ${currentProperty.name}\n` +
        `📍 *Location:* ${currentProperty.location}\n` +
        `💰 *Price:* ₹${currentProperty.price}/mo\n\n` +
        `👤 *My Name:* ${buyerName}\n` +
        `📞 *My Phone:* ${buyerPhone}\n` +
        `💬 *Message:* ${buyerMessage}\n\n` +
        `Please let me know if it is available!`;

      const whatsappURL = `https://wa.me/${ownerPhone}?text=${encodeURIComponent(messageText)}`;
      
      closeContactModal();
      window.open(whatsappURL, '_blank');
    }

    loadDetails();
  </script>
</body>
</html>

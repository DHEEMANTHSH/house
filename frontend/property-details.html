<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details — HomeRent Karnataka</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --accent: #f59e0b;
      --success: #10b981;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      color: var(--text-main);
      background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c') center/cover fixed no-repeat;
      min-height: 100vh;
      line-height: 1.6;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 6%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .logo { font-size: 1.35rem; font-weight: 800; color: var(--white); text-decoration: none; display: flex; align-items: center; }
    .logo span { color: var(--accent); }
    .logo i { color: var(--accent); font-size: 1.5rem; margin-right: 0.5rem; }
    nav ul { display: flex; list-style: none; gap: 2.5rem; align-items: center; }
    nav a { text-decoration: none; color: #cbd5e1; font-weight: 600; font-size: 0.95rem; }
    nav a:hover { color: var(--accent); }
    .container { max-width: 1280px; margin: 3rem auto; padding: 0 2rem; }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
    }
    .btn-action-card { background: var(--success); color: white; text-align: center; padding: 1rem; border-radius: 8px; text-decoration: none; font-weight: 700; cursor: pointer; border: none; width: 100%; font-size: 1.05rem; }
    .btn-action-card:hover { opacity: 0.9; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 2000; align-items: center; justify-content: center; }
    .modal-card { background: white; padding: 2.5rem; border-radius: var(--radius); width: 100%; max-width: 450px; box-shadow: var(--shadow-lg); text-align: left; position: relative; }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-muted); }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem; }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); background: var(--bg-body); border-radius: 8px; font-size: 0.95rem; outline: none; }
    .btn-submit { width: 100%; background: var(--success); color: var(--white); border: none; padding: 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .state-message { text-align: center; padding: 4rem; color: var(--text-main); font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <i class="fa-solid fa-house-chimney-user"></i>Home<span>Rent</span>KA
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="properties.html">Properties</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div id="property-details-container" class="glass-card">
      <div class="state-message"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i><p>Loading property details...</p></div>
    </div>
  </main>

  <div id="payment-modal" class="modal-overlay">
    <div class="modal-card">
      <button onclick="closePaymentModal()" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
      <h2 style="margin-bottom: 0.5rem; color: var(--primary);"><i class="fa-solid fa-shield-halved"></i> Secure Checkout</h2>
      <p id="modal-property-title" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;"></p>
      
      <form onsubmit="processPayment(event)">
        <div class="form-group">
          <label>Payment Method</label>
          <select id="pay-method" onchange="togglePaymentFields()">
            <option value="upi">UPI (GPay / PhonePe / Paytm)</option>
            <option value="card">Credit / Debit Card</option>
            <option value="netbanking">Net Banking</option>
          </select>
        </div>
        <div id="upi-field" class="form-group">
          <label>UPI ID / VPA</label>
          <input type="text" placeholder="username@okhdfcbank" required>
        </div>
        <div id="card-fields" style="display: none;">
          <div class="form-group"><label>Card Number</label><input type="text" placeholder="4111 2222 3333 4444"></div>
          <div style="display: flex; gap: 1rem;">
            <div class="form-group"><label>Expiry</label><input type="text" placeholder="MM/YY"></div>
            <div class="form-group"><label>CVV</label><input type="password" placeholder="123"></div>
          </div>
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 1rem;">
          <i class="fa-solid fa-lock"></i> Pay Securely & Book Now
        </button>
      </form>
    </div>
  </div>

  <script>
    // Dynamic API Base URL supporting both Localhost & Render
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000/api/properties' 
      : 'https://house-am79.onrender.com/api/properties';
      
    let currentProperty = null;

    async function loadDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const container = document.getElementById('property-details-container');

      if (!id) {
        container.innerHTML = '<div class="state-message"><p>Invalid Property ID specified.</p></div>';
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/${id}`);
        const result = await res.json();
        if (result.success) {
          const p = result.data;
          currentProperty = p;
          container.innerHTML = `
            <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 2.5rem; align-items: start;">
              <div>
                <img src="${p.images[0] || 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9'}" style="width:100%; height:400px; object-fit:cover; border-radius:var(--radius); margin-bottom:1.5rem;">
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">${p.name}</h1>
                <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1rem;"><i class="fa-solid fa-location-dot" style="color:var(--primary);"></i> ${p.location}, Karnataka</p>
                <div style="font-size: 1.75rem; font-weight: 800; color: var(--primary); margin-bottom: 1.5rem;">₹${p.price} <span style="font-size:0.9rem; color:var(--text-muted);">/ month (${p.purpose || 'Rent/Lease'})</span></div>
                <h3 style="margin-bottom: 0.5rem;">Description</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">${p.description}</p>
                <h3 style="margin-bottom: 0.5rem;">Key Specs</h3>
                <p style="margin-bottom: 1.5rem;"><strong>${p.bedrooms}</strong> Bedrooms &nbsp;|&nbsp; <strong>${p.bathrooms}</strong> Bathrooms &nbsp;|&nbsp; <strong>${p.propertyType}</strong></p>
              </div>
              <div style="background: var(--bg-body); padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border);">
                <h3 style="margin-bottom: 1rem;">Owner Contact</h3>
                <p style="margin-bottom: 0.5rem;"><strong>${p.owner.name}</strong></p>
                <p style="margin-bottom: 0.5rem;"><i class="fa-solid fa-phone"></i> ${p.owner.phone}</p>
                <p style="margin-bottom: 1.5rem;"><i class="fa-solid fa-envelope"></i> ${p.owner.email}</p>
                
                <button onclick="openPaymentModal()" class="btn-action-card">
                  <i class="fa-solid fa-credit-card"></i> Book & Pay Online Now
                </button>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = '<div class="state-message"><p>Property not found.</p></div>';
        }
      } catch (e) {
        container.innerHTML = '<div class="state-message"><p>Failed to connect to backend server.</p></div>';
      }
    }

    function openPaymentModal() {
      document.getElementById('modal-property-title').innerText = `Booking: ${currentProperty.name} (₹${currentProperty.price}/mo)`;
      document.getElementById('payment-modal').style.display = 'flex';
    }

    function closePaymentModal() {
      document.getElementById('payment-modal').style.display = 'none';
    }

    function togglePaymentFields() {
      const method = document.getElementById('pay-method').value;
      document.getElementById('upi-field').style.display = method === 'upi' ? 'block' : 'none';
      document.getElementById('card-fields').style.display = method === 'card' ? 'block' : 'none';
    }

    function processPayment(e) {
      e.preventDefault();
      alert('Payment Successful! Your house booking and lease agreement have been confirmed.');
      closePaymentModal();
      window.location.href = 'index.html';
    }

    loadDetails();
  </script>
</body>
</html>
